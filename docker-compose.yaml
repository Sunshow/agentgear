version: '3.8'

services:
  agentgear:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: sunshow/agentgear:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - AGENTGEAR_SERVER_PORT=9000
      - AGENTGEAR_SERVER_HOST=0.0.0.0
      - AGENTGEAR_SERVER_API_PORT=9001
      - AGENTGEAR_SERVER_API_HOST=0.0.0.0
      - AGENTGEAR_LOGGING_ENABLED=false
      - AGENTGEAR_LOGGING_DIR=/app/logs
      - AGENTGEAR_MEMORY_MAX_CONNECTIONS=1000
      - AGENTGEAR_MEMORY_RETENTION_MINUTES=60
      - AGENTGEAR_THINKING_STORE_PERSIST_PATH=/app/data/thinking_store.db
    volumes:
      - ./logs:/app/logs        # 确保宿主机目录权限: sudo chown -R 1000:1000 ./logs
      - ./proxy/configs/config.yaml:/app/configs/config.yaml:ro
      - ./data:/app/data        # 确保宿主机目录权限: sudo chown -R 1000:1000 ./data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

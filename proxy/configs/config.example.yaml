    #   compress_model: ""
    #   context_token_limit: 200000
    #   context_threshold_ratio: 0.5   # Override: 50% instead of default 70%
    #   token_estimate_ratio: 3.5
    #   model_context_limits:
    #     - model_pattern: "claude-opus-4-6*"
    #       token_limit: 1000000
    #   preserve_budget: 40000
    #   summary_budget: 4000
    #   auto_retry: true
    #   max_retries: 1

    # === Type: thinking_preserve (Thinking Blocks 保留) ===
    # Automatically caches thinking blocks from upstream responses and re-injects
    # them into requests when downstream agents drop empty thinking blocks.
    # This prevents 400 errors from upstreams that require thinking signatures.
    #
    # The builtin $preserve_thinking_blocks is enabled by default for all requests.
    # No configuration needed unless you want to customize behavior.
    #
    # How it works:
    # 1. Response: After streaming completes, extracts thinking blocks and caches
    #    them keyed by SHA256 hash of non-thinking content blocks
    # 2. Request: Scans assistant messages, finds missing thinking blocks via hash
    #    lookup, and injects cached thinking blocks at the beginning of content
    #
    # To disable, override the builtin mapping:
    # - name: "$preserve_thinking_blocks_mapping"
    #   enabled: false
    #   tags: []
    #   transformer: "$preserve_thinking_blocks"

    # === Type: cache_strip (缓存 Token 擦除) ===
    # Merges cache_read_input_tokens + cache_creation_input_tokens into input_tokens,
    # then zeros out the cache fields. Use this when the downstream agent should NOT
    # perceive cache hits at all (e.g. it bills purely by total input_tokens).
    #
    # Logic:
    #   input_tokens = input_tokens + cache_read + cache_creation
    #   cache_read_input_tokens = 0
    #   cache_creation_input_tokens = 0
    #
    # Scope: streaming message_start/message_delta and non-streaming response usage.
    #
    # Example: custom definition (usually just enable the builtin mapping below)
    # - name: "my_cache_strip"
    #   description: "Strip cache tokens from usage"
    #   type: "cache_strip"
    #   direction: "response"            # cache_strip only supports "response"

    # === Type: cache_dedup (缓存 Token 去重) ===
    # Fixes upstreams that double-count cached tokens by reporting an input_tokens
    # value that ALREADY INCLUDES the cache portion, while also listing it separately
    # via cache_read_input_tokens. Without dedup, a standards-compliant relay would
    # bill the cached tokens twice (once in input_tokens, once in cache_read).
    #
    # Symptom example:
    #   Upstream returns: input_tokens=24336, cache_read_input_tokens=24256
    #   (the real non-cached input is only 24336 - 24256 = 80 tokens)
    #   Relay bills: (24336 * $8 + 24256 * $2 + 134 * $28) * group_ratio
    #   Correct billing should use input_tokens=80 instead of 24336.
    #
    # Logic (only when input_tokens >= cache_read + cache_creation):
    #   input_tokens = input_tokens - cache_read_input_tokens - cache_creation_input_tokens
    #   # cache_read_input_tokens and cache_creation_input_tokens are PRESERVED
    #
    # Safety: when input_tokens < cache total (Anthropic native semantics where input
    # does NOT include cache), the transformer skips to avoid corrupting valid usage.
    #
    # Scope: streaming message_start/message_delta and non-streaming response usage.
    #
    # IMPORTANT: do NOT enable cache_dedup and cache_strip for the same request.
    # cache_dedup keeps cache fields; cache_strip zeroes them. Stacking is pointless.
    #
    # Example: custom definition (usually just enable the builtin mapping below)
    # - name: "my_cache_dedup"
    #   description: "Fix upstream cache double-counting"
    #   type: "cache_dedup"
    #   direction: "response"            # cache_dedup only supports "response"

  # Mapping rules (bind transformers to conditions)
  mappings:
    # Example: Apply transformer for Droid agent via WARP gateway
    # - name: "droid_warp_transform"
    #   description: "Apply create_documents transform for Droid via WARP"
    #   enabled: true
    #   tags: ["$a_droid"]              # Required tags (all must match)

    #   gateways: ["warp-proxy"]        # Required gateways (any must match)
    #   transformer: "create_documents_to_ExitSpecMode"
    
    # Example: Enable automatic compression for specific tags
    # - name: "my_compress_mapping"
    #   description: "Enable auto compression for Droid agent"
    #   enabled: true
    #   tags: ["$a_droid"]              # Apply to requests with these tags
    #   transformer: "$auto_compress"   # Use builtin compress transformer
    
    # Example: Apply to Droid but exclude WARP gateway
    # - name: "droid_non_warp_mapping"
    #   description: "Apply to Droid agent but exclude WARP gateway"
    #   enabled: true
    #   tags: ["$a_droid"]              # Required: must have Droid agent tag
    #   exclude_tags: ["$u_warp"]       # Excluded: must NOT have WARP gateway tag
    #   transformer: "my_transformer"
    
    # Example: Apply to all requests except specific agent
    # - name: "exclude_specific_agent"
    #   description: "Apply to all except Cursor agent"
    #   enabled: true
    #   tags: []                        # Empty = match all
    #   exclude_tags: ["$a_cursor"]     # Exclude Cursor agent
    #   transformer: "another_transformer"

    # Example: Enable builtin 400 auto compress retry for Cursor agent
    # - name: "cursor_400_auto_compress_retry"
    #   description: "Cursor Agent 400 error auto compress retry"
    #   enabled: true
    #   tags: ["$a_cursor", "$u_kiro"]
    #   transformer: "$generic_400_auto_compress_retry"

    # Example: Enable builtin 400 auto compress retry for all non-Droid agents
    # - name: "non_droid_400_auto_compress_retry"
    #   description: "Non-Droid Agent 400 error auto compress retry"
    #   enabled: true
    #   tags: ["$u_kiro"]
    #   exclude_tags: ["$a_droid"]
    #   transformer: "$generic_400_auto_compress_retry"

    # Example: Enable force compress hint for Cursor agent via template instance
    # - name: "cursor_kiro_force_compress_mapping"
    #   description: "Cursor+Kiro: 触发 Cursor 自身压缩"
    #   enabled: true
    #   tags: ["$a_cursor", "$u_kiro"]
    #   transformer: "cursor_kiro_force_compress"

    # Example: Enable builtin $cache_strip (erase cache fields, merge into input)
    # Use when the downstream agent should not perceive cache hits at all.
    # - name: "$cache_strip_mapping"
    #   enabled: true
    #   tags: ["$a_droid"]              # Narrow to specific agent/upstream as needed
    #   transformer: "$cache_strip"

    # Example: Enable builtin $cache_dedup (fix upstream cache double-counting)
    # The builtin mapping is disabled by default. Override it with enabled: true
    # and add tags to scope it to the upstream that reports double-counted usage.
    # Verify against a single billing log entry before enabling globally.
    # Do NOT stack with cache_strip on the same request.
    # - name: "$cache_dedup_mapping"
    #   description: "Fix upstream cache double-counting for problematic channel"
    #   enabled: true
    #   tags: ["$u_xxx"]                # Replace with the upstream tag that double-counts
    #   transformer: "$cache_dedup"



    #     - key: "X-Custom-Agent"
    #       value: "AgentGear/{{gateway}}"
    #     - key: "X-Request-Id"
    #       value: "{{request_id}}"
    #     - key: "X-Session-Id"
    #       value: "{{session_id}}"     # Supports {{session_id}}, {{request_id}}, {{gateway}}

    # === Type: compress (上下文压缩) ===
    # Example: Automatic context compression transformer
    # - name: "my_auto_compress"
    #   description: "Automatic context compression when token limit is reached"
    #   type: "compress"
    #   direction: "request"            # compress only supports "request"
    #   
    #   # Trigger conditions (similar to error_transform)
    #   context_token_limit: 200000     # Default token limit
    #   model_context_limits:           # Model-specific limits (higher priority)
    #     - model_pattern: "claude-opus-4-6*"
    #       token_limit: 1000000
    #   context_threshold_ratio: 0.7    # Trigger at 70% of limit
    #   token_estimate_ratio: 3.5       # Bytes to tokens estimation ratio
    #   image_token_estimate: 1600      # Single image token estimate (default 1600)
    #   
    #   # Compression configuration
    #   compress_target: "same"         # "same" | "gateway:name" | "url:https://..."
    #                                   # - "same": Use current gateway's upstream
    #                                   # - "gateway:name": Use specified gateway
    #                                   # - "url:https://...": Use custom URL
    #   compress_model: ""              # Model for compression (leave empty to use original request model)
    #   compress_system_prompt: |       # System prompt for compression (optional, has default 13-part summary guidelines)
    #     You are an AI assistant specialized in summarizing conversation history...
    #   compress_user_prompt: |         # User prompt appended after history (optional, has default)
    #     Please read the complete conversation above and generate a summary...
    #   
    #   # Message splitting configuration
    #   preserve_budget: 40000          # Preserve recent N tokens
    #   summary_budget: 4000            # Summary budget tokens
    #   
    #   # Post-compression handling

# =============================================================================
# AgentGear Configuration
# =============================================================================
# Copy this file to config.yaml and modify as needed.
# Environment variables can override config values with prefix AGENTGEAR_
# Example: AGENTGEAR_SERVER_PORT=8080
# =============================================================================

# -----------------------------------------------------------------------------
# Server Configuration
# -----------------------------------------------------------------------------
server:
  port: 9000              # Proxy server port
  host: "0.0.0.0"         # Proxy server bind address
  api_port: 9001          # Internal API port (for management/monitoring)
  api_host: "0.0.0.0"     # Internal API bind address

# -----------------------------------------------------------------------------
# Gateway Configuration
# -----------------------------------------------------------------------------
# Define upstream API gateways. Each gateway maps a local path to an upstream URL.
# Multiple gateways can be configured for different upstream services.
gateways:
  # Direct Anthropic API gateway
  - name: "anthropic"
    path: "/v1"                           # Local path prefix
    upstream: "https://api.anthropic.com" # Upstream API URL
    type: ""                              # Gateway type: "" | "warp" | "kiro"
                                          # - "": No special handling
                                          # - "warp": Injects $u_warp tag, enables WARP transformers
                                          # - "kiro": Injects $u_kiro tag, enables Kiro transformers
    timeout: 300                          # Request timeout in seconds
    enabled: true                         # Enable/disable this gateway

  # Example: WARP reverse proxy gateway (uncomment to use)
  # - name: "warp-proxy"
  #   path: "/warp"
  #   upstream: "https://warp.example.com"
  #   type: "warp"
  #   timeout: 300
  #   enabled: true

  # Example: Kiro gateway (uncomment to use)
  # - name: "kiro-proxy"
  #   path: "/kiro"
  #   upstream: "https://kiro.example.com"
  #   type: "kiro"
  #   timeout: 600
  #   enabled: true

  # Example: DeepSeek API gateway (Anthropic-compatible protocol)
  # DeepSeek supports extended thinking with signatures.
  # The builtin thinking_preserve transformer automatically caches and
  # re-injects thinking blocks that downstream agents may drop.
  # - name: "deepseek"
  #   path: "/deepseek"
  #   upstream: "https://api.deepseek.com"
  #   type: ""
  #   timeout: 600
  #   enabled: true

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
# Request/response logging to files for debugging and analysis.
logging:
  enabled: false          # Enable file logging (disable in production for performance)
  dir: "./logs"           # Log directory path
  max_size: 100           # Max size per log file in MB before rotation
  max_backups: 10         # Max number of old log files to retain
  max_age: 30             # Max days to retain old log files

# -----------------------------------------------------------------------------
# Memory Store Configuration
# -----------------------------------------------------------------------------
# In-memory connection storage for real-time monitoring via API/WebSocket.
memory:
  max_connections: 1000       # Max connections to keep in memory (ring buffer)
  max_request_body_kb: 512    # Max request body size to store (KB), larger bodies truncated
  max_response_body_kb: 512   # Max response body size to store (KB), larger bodies truncated
  retention_minutes: 60       # Auto-cleanup connections older than this (minutes)

# -----------------------------------------------------------------------------
# Tagging System
# -----------------------------------------------------------------------------
# Automatically tag requests based on matching rules.
# Tags can be used to conditionally apply transformers.
#
# Tag naming conventions:
# - System tags: Start with $ (e.g., $a_droid, $a_opencode, $u_warp), auto-generated
# - User tags: Start with letter or _, contain only letters/numbers/_
#
# Priority: Smaller value = higher priority (evaluated first)
# User-defined rules must have priority >= 0
tagging:
  skip_mcp_tool_tags: true    # Skip $t_ tag generation for MCP tools (tool names containing "___"), default true
  rules:
    # ===== Basic rules (priority 0-99) =====
    
    - name: "has_session"
      priority: 0
      enabled: true
      matchers:
        - type: header              # Matcher type: header | body_json | tag | tags | tool | tools
          key: "X-Session-Id"       # Header name to match
          match:
            op: exists              # Match operation: exists | not_exists | eq | ne | contains | 
                                    #                 not_contains | prefix | suffix | regex | in | not_in
      tags:
        - has_session

    # ===== Client detection rules (priority 100-199) =====
    
    - name: "mobile_client"
      priority: 100
      enabled: true
      matchers:
        - type: header
          key: "User-Agent"
          match:
            op: contains
            value: "Mobile"
      tags:
        - mobile_client

    # ===== Tool detection rules (priority 200-299) =====
    
    # Example: Detect requests with specific tools
    # - name: "has_edit_tool"
    #   priority: 200
    #   enabled: true
    #   matchers:
    #     - type: tool
    #       tool: "Edit"
    #   tags:
    #     - has_edit

    # ===== Combination rules (priority 500+, depend on previous rules) =====
    
    - name: "droid_mobile"
      priority: 500
      enabled: true
      matchers:
        - type: tags
          tags: ["$a_droid", "mobile_client"]
          tag_op: all               # Tag match operation: all (AND) | any (OR)
      tags:
        - droid_mobile

# -----------------------------------------------------------------------------
# Transformers Configuration
# -----------------------------------------------------------------------------
# Transform tool calls in requests/responses.
# Useful for adapting between different Agent protocols.
#
# Structure:
# - definitions: Define transformer logic (source tool -> target tool mapping)
# - mappings: Bind transformers to conditions (tags/gateways)
#
# Note: User-defined transformers with the same name as builtin transformers will override them.
# This allows you to customize builtin behavior without modifying mappings.
transformers:
  # Transformer definitions
  definitions:
    # === Type: tool (工具转换) ===
    # Example: Transform create_documents to ExitSpecMode (for Droid compatibility)
    # - name: "create_documents_to_ExitSpecMode"
    #   description: "Convert create_documents tool call to ExitSpecMode"
    #   type: "tool"                    # "tool" (default) | "message_inject" | "error_transform"
    #   direction: "response"           # "request" or "response"
    #   source_tool: "create_documents"
    #   target_tool: "ExitSpecMode"
    #   accumulate: true                # Accumulate streaming deltas before transform
    #   param_mapping:
    #     - from: "new_documents[0].content"
    #       to: "plan"
    #       transform: ""               # Optional: transformation function

    # === Type: tool (纯 Header 注入) ===
    # - name: "add_headers_all_tools"
    #   description: "Add headers to all requests"
    #   type: "tool"
    #   direction: "request"
    #   source_tool: ""                 # Empty = match all tools
    #   target_tool: ""                 # Empty = no tool name transform
    #   header_injections:
    #     - key: "X-Agent-Type"
    #       value: "Droid"
    #     - key: "X-Session-Context"
    #       value: "{{session_id}}"     # Supports {{session_id}}, {{request_id}}, {{gateway}}

    # === Type: message_inject (消息注入) ===
    # Example: Message injection transformer
    # - name: "inject_system_reminder"
    #   description: "Inject system reminder into request"
    #   type: "message_inject"
    #   direction: "request"            # message_inject only supports "request"
    #   inject_text: "Remember to follow the guidelines."
    #   inject_format: "system-reminder"  # "system-reminder" | "plain"
    #   header_injections:              # Optional: can also inject headers
    #     - key: "X-Message-Injected"
    #       value: "true"

    # === Type: error_transform (错误转换) ===
    # Example: Error transform with model-specific context limits
    # - name: "kiro_context_check"
    #   description: "Context limit check with model-specific thresholds"
    #   type: "error_transform"
    #   direction: "response"           # error_transform only supports "response"
    #   error_code: "context_length_exceeded"
    #   error_message: "prompt is too long: request size exceeds limit"
    #   request_size_threshold: 500000
    #   context_token_limit: 200000  # Default limit for most models
    #   model_context_limits:         # Model-specific limits (higher priority)
    #     - model_pattern: "claude-opus-4-6*"   # Matches claude-opus-4-6, claude-opus-4-6-20260101, etc.
    #       token_limit: 1000000
    #     - model_pattern: "claude-opus-4.6*"   # Matches claude-opus-4.6, claude-opus-4.6-20260101, etc.
    #       token_limit: 1000000
    #   context_threshold_ratio: 0.85  # Trigger at 85% of limit
    #   token_estimate_ratio: 3.5      # Bytes to tokens estimation ratio
    #   image_token_estimate: 1600     # Single image token estimate (default 1600, Anthropic medium-size image ~1600 tokens)

    # === Using template: $tpl_force_hint_context_length_exceeded ===
    # Example: Create custom force compress transformer for Cursor agent (60% threshold)
    # - name: "cursor_kiro_force_compress"
    #   description: "Cursor+Kiro 触发压缩（60% 阈值）"
    #   template_ref: "$tpl_force_hint_context_length_exceeded"
    #   template_args:
    #     error_code: "context_length_exceeded"
    #     error_message: "prompt is too long: request size exceeds limit"
    #     request_size_threshold: "500000"
    #     context_token_limit: "200000"
    #     context_threshold_ratio: "0.6"
    #     token_estimate_ratio: "3.5"
    #     image_token_estimate: "1600"

    # Example: Override builtin $droid_upstream_kiro_force_compress to adjust threshold
    # - name: "$droid_upstream_kiro_force_compress"
    #   description: "Override builtin error transformer with custom threshold"
    #   template_ref: "$tpl_force_hint_context_length_exceeded"
    #   template_args:
    #     error_code: "context_length_exceeded"
    #     error_message: "prompt is too long: request size exceeds limit"
    #     request_size_threshold: "500000"
    #     context_token_limit: "200000"
    #     context_threshold_ratio: "0.6"  # Override: 60% instead of default 70%
    #     token_estimate_ratio: "3.5"
    #     image_token_estimate: "1600"
    #   context_threshold_ratio: 0.6  # Override: 60% instead of default 70%
    #   token_estimate_ratio: 3.5
    #   image_token_estimate: 1600     # Single image token estimate (default 1600)
    #   model_context_limits:
    #     - model_pattern: "claude-opus-4-6*"
    #       token_limit: 1000000
    #     - model_pattern: "claude-opus-4.6*"
    #       token_limit: 1000000

    # === Type: header_inject (Header 注入) ===
    # Example: Header injection transformer
    # - name: "inject_custom_agent_header"
    #   description: "Inject custom agent header to upstream"
    #   type: "header_inject"
    #   direction: "request"            # Can be "request" or "response"
